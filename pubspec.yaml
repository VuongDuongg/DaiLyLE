name: dailyle
description: "Dailyle: AI Pronunciation Assessment and Discipline Learning Application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1

  # Audio Recording & Playback (Cross-platform Android & Web)
  record: ^5.1.2
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.2

  # Backend & Supabase Ecosystem
  supabase_flutter: ^2.5.4
  http: ^1.2.1

  # Local paths & Storage
  path_provider: ^2.1.3
  shared_preferences: ^2.2.0

  # Charts & Visualizations
  fl_chart: ^0.68.0

  # Notifications & Timezones (Android & Local)
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
